<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /*
   * CDN sub-path guard — must run before any other tag resolves a URL.
   *
   * Stake Engine serves the game from `.../{gameID}/{version}/index.html`, but
   * the page can be requested without the trailing slash. The browser then
   * resolves every relative URL (including the module bundle itself) against
   * the PARENT folder, so the game silently 404s and the player is left with a
   * blank stage and no error — the script never ran to report one.
   *
   * Anchoring an explicit <base> on the directory makes relative URLs correct
   * either way.
   */
  (function () {
    var p = location.pathname;
    /* Only an explicit .html document is a file here. A generic
       "has a dot" test misfires on version folders like `1.0.0`, which is
       exactly the path Stake Engine serves from. */
    if (!/\/$/.test(p) && !/\.html?$/i.test(p)) {
      var b = document.createElement('base');
      b.href = p + '/';
      document.head.appendChild(b);
    }
  })();
</script>
<title>Molten Crown — PixiJS Renderer</title>
<style>
  :root{
    --bg:#0a0806; --panel:#14100c; --line:#2a2018;
    --amber:#ff7a18; --amber2:#ffb347; --teal:#37e0c8; --gold:#f2c14e;
    --txt:#f4ece0; --dim:#9a8c78;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overscroll-behavior:none;
  }
  #stage{flex:1; min-height:0; position:relative; touch-action:manipulation}
  #stage canvas{display:block; width:100%; height:100%}

  /* Game controls are rendered inside the canvas (see src/render/UiPanel.ts).
     This strip keeps accessibility options in the DOM so assistive technology
     and OS-level settings can still reach them. */
  #controls{
    display:flex; gap:16px; align-items:center; flex-wrap:wrap;
    padding:6px max(10px, env(safe-area-inset-left)) max(6px, env(safe-area-inset-bottom));
    background:#0c0906; border-top:1px solid var(--line);
  }
  select,button{
    background:#1b140d; color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; font-size:14px; min-height:44px; cursor:pointer;
  }
  button#spin, button.primary{
    background:linear-gradient(#ff8a2a,#d95b00); border:none; font-weight:800; letter-spacing:1px;
  }
  button#spin{flex:1; min-width:120px}
  button:disabled{opacity:.45; cursor:default}
  button[data-on="true"]{border-color:var(--teal); color:var(--teal)}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
  .meta{display:flex; gap:14px; font-size:12px; color:var(--dim); margin-left:auto}
  .meta b{display:block; color:var(--amber2); font-size:15px; font-variant-numeric:tabular-nums}
  label.tg{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim)}
  #err{color:#ff8a8a; font-size:12px; min-height:14px; width:100%}
  @media (max-width:560px){ .meta{width:100%; margin-left:0; justify-content:space-between} }

  /* ---- overlays (help / buy) ---- */
  .overlay{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(6,4,2,.74); padding:16px;
  }
  .overlay[hidden]{display:none}
  .overlay-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    max-width:min(640px,100%); max-height:88vh; display:flex; flex-direction:column; width:100%;
  }
  .overlay-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .overlay-head h2{margin:0; font-size:17px; letter-spacing:1px; color:var(--amber2)}
  .overlay-close{padding:6px 12px; min-height:36px}
  .overlay-body{padding:16px; overflow-y:auto; line-height:1.55; font-size:14px}
  .overlay-body h3{margin:20px 0 6px; font-size:14px; color:var(--amber2); letter-spacing:.5px}
  .overlay-body h3:first-child{margin-top:0}
  .overlay-body p{margin:0 0 10px}
  .overlay-body ul{margin:0 0 10px; padding-left:0; list-style:none}
  .overlay-body li{margin-bottom:8px}
  .dim{color:var(--dim); font-size:13px}
  .kpis{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .kpis>div{
    background:#1b140d; border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; font-size:12px; color:var(--dim); flex:1; min-width:110px;
  }
  .kpis b{display:block; color:var(--gold); font-size:16px; margin-top:2px; font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:13px}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
  th{color:var(--dim); font-weight:600; font-size:12px}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .swatch{
    display:inline-block; vertical-align:middle; width:34px; height:34px;
    background-repeat:no-repeat; flex:0 0 auto;
  }
  .overlay-body li{display:flex; gap:10px; align-items:flex-start}
  .row-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px}
  .row-actions button{min-width:110px}

  /* ---- loading ---- */
  .loading{
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#1c130b 0%,#0a0806 65%);
    transition:opacity .3s ease;
  }
  .loading.is-hidden{opacity:0; pointer-events:none}
  .loading-inner{text-align:center; width:min(300px,80vw)}
  .loading-title{
    font-size:22px; font-weight:900; letter-spacing:5px; margin-bottom:16px;
    background:linear-gradient(#ffe9c2,var(--amber));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .loading-track{height:6px; background:#20180f; border-radius:3px; overflow:hidden}
  .loading-bar{height:100%; width:0; background:linear-gradient(90deg,#7a2d00,var(--amber),#fff2cc); transition:width .25s}
  .loading-text{margin-top:10px; font-size:12px; color:var(--dim)}

  @media (prefers-reduced-motion:reduce){
    .loading,.loading-bar,.loading.is-hidden{transition:none}
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="controls">
    <label class="tg"><input type="checkbox" id="reduced"> <span id="lblReduced">Reduced motion</span></label>
    <label class="tg"><input type="checkbox" id="mute"> Mute</label>
    <div id="err" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>

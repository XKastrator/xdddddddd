<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Molten Crown — PixiJS Renderer</title>
<style>
  :root{
    --bg:#0a0806; --panel:#14100c; --line:#2a2018;
    --amber:#ff7a18; --amber2:#ffb347; --teal:#37e0c8; --gold:#f2c14e;
    --txt:#f4ece0; --dim:#9a8c78;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overscroll-behavior:none;
  }
  #stage{flex:1; min-height:0; position:relative; touch-action:manipulation}
  #stage canvas{display:block; width:100%; height:100%}
  #controls{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
    background:var(--panel); border-top:1px solid var(--line);
  }
  select,button{
    background:#1b140d; color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; font-size:14px; min-height:44px; cursor:pointer;
  }
  button#spin{
    background:linear-gradient(#ff8a2a,#d95b00); border:none; font-weight:800;
    letter-spacing:1px; flex:1; min-width:120px;
  }
  button#spin:disabled{opacity:.45; cursor:default}
  button[data-on="true"]{border-color:var(--teal); color:var(--teal)}
  button:focus-visible,select:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
  .meta{display:flex; gap:14px; font-size:12px; color:var(--dim); margin-left:auto}
  .meta b{display:block; color:var(--amber2); font-size:15px; font-variant-numeric:tabular-nums}
  label.tg{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim)}
  #err{color:#ff8a8a; font-size:12px; min-height:14px; width:100%}
  @media (max-width:520px){ .meta{width:100%; margin-left:0; justify-content:space-between} }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="controls">
    <button id="spin" aria-label="Spin">SPIN</button>
    <select id="mode" aria-label="Bet mode">
      <option value="base">Base 1×</option>
      <option value="ante">Stoked 1.25×</option>
      <option value="bonus">Buy Forge Fury 100×</option>
      <option value="super">Buy Molten Core 500×</option>
    </select>
    <select id="bet" aria-label="Bet level">
      <option value="100000">$0.10</option>
      <option value="200000">$0.20</option>
      <option value="500000">$0.50</option>
      <option value="1000000" selected>$1.00</option>
      <option value="2000000">$2.00</option>
      <option value="5000000">$5.00</option>
    </select>
    <button id="skip" aria-label="Skip animation">SKIP</button>
    <button id="turbo" data-on="false" aria-label="Turbo">TURBO</button>
    <label class="tg"><input type="checkbox" id="reduced"> Reduced motion</label>
    <div class="meta">
      <div>BALANCE<b id="balance">$0.00</b></div>
      <div>BET COST<b id="cost">$0.00</b></div>
    </div>
    <div id="err" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
